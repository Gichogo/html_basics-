<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <input type="text" id="result" placeholder="0" readonly>
        <button onclick ="appendNumber(1)" >1</button>
        <button onclick = "appendNumber(2)" >2</button>
        <button  onclick = "appendNumber(3)">3</button>
        <button onclick  = "appendNumber(4)">4</button>
        <button onclick = "appendNumber(5)" >5</button>
        <button onclick = "appendNumber(6)" >6</button>
        <button onclick = "appendNumber(7)" >7</button>
        <button onclick = "appendNumber(8)" >8</button>
        <button onclick = "appendNumber(9)" >9</button>
        <button onclick = "appendNumber(0)" >0</button>
        <button onclick = "appendOperator('+')">+</button>
        <button onclick = "appendOperator('-')">-</button>
        <button onclick = "appendOperator('*')">*</button>
        <button onclick = "appendOperator('/')">/</button>
        <button onclick = "calculate()">=</button>
        <button onclick = "clearResult()">C</button>
  
        
    </div>
    
</body>
<script>

    let curreNumber ='';
    let previousNumber ='';
    let operator ='';

   function appendNumber(num){
     curreNumber += num;
     updateDisplay();
   }

   function appendOperator(op){
        if(curreNumber === '') return;
        if(previousNumber !== ''){
            calculate();
        }
        operator = op;
        previousNumber = curreNumber;
        curreNumber = '';
    }

        function calculate(){
            let result;
            const prev = parseFloat(previousNumber);
            const current = parseFloat(curreNumber);
            if(isNaN(prev) || isNaN(current)) return;
            switch(operator){
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    result = prev / current;
                    break;
                default:
                    return;
            }
            curreNumber = result.toString();
            operator = '';
            previousNumber = '';
            updateDisplay();
        }
    
        function updateDisplay(){
            document.getElementById("result").value = curreNumber;
        }
        function clearResult(){
            curreNumber = '';
            previousNumber = '';
            operator = '';
            updateDisplay();
        }
    




</script>
</html>
