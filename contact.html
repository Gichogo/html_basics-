<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Contact Us - samsonite tech</title>
</head>
<body>
    <main class="signup-root">
        <section class="form-wrap">
            <div class="brand">
                <h1>sign up to samsonite tech</h1>
                <p class="tag">Join our community today and enjoy our service</p>
            </div>
            <!-- main sign up form -->
             <form id="signup-form" novalidate>
                <div class="field">
                    <label for="name">full name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required autocomplete="name"/>
                </div>
                <div class="field">
                    <label for="email">email address</label>
                    <input type="email" id="email" name="email" type="email" placeholder="your.email@example.com" required autocomplete="email"/>
                </div>
                <!-- password field with toggle and strength indicator -->
                 <div class="field">
                    <label for="password">password</label>
                    <div class="input-with-icon">
                        <input id="password" name="password" type="password" placeholder="Enter a password" minlength="8 characters" autocomplete="new-password"/>
                        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="show password">👁️</button>
                        </button>
                        <div class="strength" aria-hidden="true">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirm-password">confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" minlength="8 characters" required autocomplete="new-password"/>
                    </div>
                    <!-- submit button with loading spinner-->
                     <div class="actions">
                        <button type="submit" class="btn-primary" id="submit-btn">
                            <span class="btn-text">create account</span>
                            <span class="spinner" id="submit-spinner" aria-hidden="true"></span>
                        </button>
                        <div>
                            <p class="small">Already have an account? <a href="/login">Log in</a></p>
                        </div>
                        <!--social signing optins -->
                            <div class="socials">
                                <button type="button" class="btn-social google" id="google-signup">sign up with google</button>
                                <button type="button" class="btn-social github" id="github-signup">sign up with github</button>
                            </div>
                            <div id="status" aria-live="polite" class="status" hidden></div>
                     </div>
                 </div>
                </form>
            </section>
    </main>
    <script src="main.js" defer></script>
</body>
</html>
